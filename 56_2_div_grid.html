<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
<style>

/*

        display: grid;

   /*     grid-template-rows: 80px 80px;             /* Alt alta 2 tane 80px'lik satır */

    .item {
        background-color: #3498db;
        color: white;
        padding: 20px;
        text-align: center;
        font-size: 20px;
    }





/*
    .grid-container {
       display: grid;
        /* Ekranı eşit şekilde 3 parçaya böler ve her birine 1fr pay verir */
   /*   grid-template-columns: repeat(3, 1fr);
        gap: 15px;
     } */



    .grid-container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

/* 1. eleman 2 sütun kaplasın */
    .item:nth-child(1) {
        grid-column: span 2;
        background-color: #e74c3c;
    }

    /* 4. eleman 2 satır kaplasın */
    .item:nth-child(4) {
        grid-row: span 2;
        background-color: #2ecc71;
    }

.item:nth-child(6) {
    grid-row: span 2;
    background-color: #2ecc71;
}






</style>



</head>
<body>
<div class="grid-container">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
    <div class="item">6</div>
    <div class="item">7</div>
    <div class="item">8</div>
    <div class="item">9</div>
</div>
</body>
</html>
